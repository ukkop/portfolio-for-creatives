<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="it's the sims but on paper" />
    <title>sonia's dollhouse</title>
    <link rel="stylesheet" href="/css/general.css" />
    <link rel="stylesheet" href="/css/dollhouse.css" />
    <script src="/script/navbar.js"></script>
    <script src="/script/points.js"></script>

    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/32.png" />
  </head>

  <body>
    <div id="main-content">
      <div id="navbar"></div>
      <a href="/pumba/desktop" class="back-link">back to the computer</a>
      <a
        href="https://form.jotform.com/252394138559366"
        target="_blank"
        class="cta-button"
      >
        send house
      </a>
      <div class="background-container">
        <img
          id="background-image"
          src="/assets/thegarden/andy-ukkop-poystila_the-garden-background-image-ap-portfolio.jpg"
          alt="dollhouse background"
        />
        <div class="furniture">
          <img
            src="/assets/thegarden/andy-ukkop-poystila-garden-gifs-portfolio_1.gif"
            class="furniture-piece"
            alt="balcony"
          />
          <img
            src="/assets/thegarden/andy-ukkop-poystila-garden-gifs-portfolio_2.gif"
            class="furniture-piece"
            alt="balcony"
          />
          <img
            src="/assets/thegarden/andy-ukkop-poystila-garden-gifs-portfolio_3.gif"
            class="furniture-piece"
            alt="bed"
          />
          <img
            src="/dollhouse/books.png"
            class="furniture-piece"
            alt="bookshelf"
          />
          <img
            src="/dollhouse/canvas.png"
            class="furniture-piece"
            alt="canvas"
          />
          <img
            src="/dollhouse/chaira.png"
            class="furniture-piece"
            alt="chair"
          />
          <img
            src="/dollhouse/chairb.png"
            class="furniture-piece"
            alt="chair"
          />
          <img src="/dollhouse/clock.png" class="furniture-piece" alt="clock" />
          <img
            src="/dollhouse/paintingclown.png"
            class="furniture-piece"
            alt="chair"
          />
          <img src="/dollhouse/door.png" class="furniture-piece" alt="door" />
          <img src="/dollhouse/plant.png" class="furniture-piece" alt="plant" />
          <img src="/dollhouse/sofa.png" class="furniture-piece" alt="sofa" />
          <img src="/dollhouse/rug.png" class="furniture-piece" alt="rug" />
          <img src="/dollhouse/oven.png" class="furniture-piece" alt="oven" />
          <img
            src="/dollhouse/fridge.png"
            class="furniture-piece"
            alt="fridge"
          />
          <img
            src="/dollhouse/shower.png"
            class="furniture-piece"
            alt="shower"
          />
          <img
            src="/dollhouse/weights.png"
            class="furniture-piece"
            alt="weights"
          />
          <img src="/dollhouse/cats.png" class="furniture-piece" alt="cat wc" />
          <img
            src="/dollhouse/tablelong.png"
            class="furniture-piece"
            alt="chair"
          />
          <img src="/dollhouse/sink.png" class="furniture-piece" alt="sink" />
        </div>
      </div>
    </div>
    <button id="info-button">
      <a href="#info-popup">?</a>
    </button>
    <div id="info-popup" class="info-popup">
      <a href="#" class="info-popup-overlay"></a>
      <div class="info-popup-content">
        ⠀ ⠀
        <p>the intern is out buying walls and windows</p>
        <p>⠀ ⠀ ⠀ ⠀ ⠀</p>
        <p>double-click to flip each piece</p>
        <p></p>
        <p>hit ᐛ ᐕ to change floorplans</p>
        <p></p>
        <p>screenshot your house and send to pumba</p>
      </div>
    </div>
    <script src="dollhouse.js"></script>
  </body>
</html>

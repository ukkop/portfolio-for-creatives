  <body class="hero" id="top">
    <section>
      <!-- Global Nav  -->

      <ul
        class="nav-branding"

      >
        <li>
          <a href="index.html"

        <li>
          <div class="the-garden-spotify">

              style="
                translate: none;
                rotate: none;
                scale: none;
                touch-action: none;
                cursor: grab;
                transform: translate3d(69.1289px, -16px, 0px);
                user-select: none;
                z-index: 1001;

              Click here to move

          </div>
